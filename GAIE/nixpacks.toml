# Nixpacks (Railway) — diz ao builder que isto e um app Python.
# Como nao temos requirements.txt na raiz, declaramos tudo aqui.

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip && pip install -r deploy/requirements.txt"]

[start]
cmd = "streamlit run src/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
